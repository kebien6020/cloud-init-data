[Interface]
PrivateKey = {{ private_key.stdout }}
Address = 10.8.0.1/24
ListenPort = 51820
SaveConfig = true

PostUp = iptables -t nat -I POSTROUTING -o {{ default_interface.stdout }} -j MASQUERADE
PostUp = ip6tables -t nat -I POSTROUTING -o {{ default_interface.stdout }} -j MASQUERADE

PreDown = iptables -t nat -D POSTROUTING -o {{ default_interface.stdout }} -j MASQUERADE
PreDown = ip6tables -t nat -D POSTROUTING -o {{ default_interface.stdout }} -j MASQUERADE
